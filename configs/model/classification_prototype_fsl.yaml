_target_: models.ClassificationModulePrune_FSL.ClassificationModulePrototype_FSL
lr: 0.01
#lr: 1e-6
warmup_epochs: 15
pruning_start: 80
max_epochs: ${trainer.max_epochs}
embed_projection: True
aggregate_similarity: nonlinear
prototype_dim: 512
nb_prototypes: 312 #for CUB dataset
prune_model_interval: 10
threshold_importance: 0
n_way: 5
k_shot: 1
n_query: 15
loss_type: cross_entropy
freeze_backbone: False
image_encoder:
  _target_: models.backbones.dinov2.DinoFeaturizer.DinoFeaturizer
  #arch: dinov2_vitb14_reg
  arch: dino_vitb16
  dim: ${model.prototype_dim}
  pretrained_weights: /home/WRS/SPM/pretraind model/dino_vitbase16_pretrain.pth
  dropout: 0.1
